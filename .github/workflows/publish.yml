name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-root --without dev --no-interaction --no-ansi

      - name: Get current version
        id: get_version
        run: |
          echo "CURRENT_VERSION=$(poetry version -s)" >> $GITHUB_ENV
          echo "Current version is $CURRENT_VERSION"

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "LATEST_TAG=${TAG}" >> $GITHUB_ENV
          echo "Latest tag is $LATEST_TAG"

      - name: Check if version bump is required
        id: check_version
        run: |
          CURRENT_VERSION=${{ env.CURRENT_VERSION }}
          LATEST_TAG=${{ env.LATEST_TAG }}

          # Use Python for robust version comparison
          if python -c "from packaging.version import Version; exit(0) if Version('$CURRENT_VERSION') > Version('$LATEST_TAG') else exit(1)"; then
            echo "Version $CURRENT_VERSION > $LATEST_TAG. Proceeding with publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION <= $LATEST_TAG. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          poetry publish --build --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create new tag
        if: steps.check_version.outputs.should_publish == 'true'
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ env.CURRENT_VERSION }}
          git push origin --tags
