[pytest]
testpaths =
    crudclient/*/tests
    tests/

# Default options: detailed summary report (-ra), parallel execution (-n auto), show slowest tests (--durations)
addopts = -ra -n auto --durations=10 --no-header --tb=short

# Test discovery patterns
python_files = test_*.py

markers =
    no_parallel: mark test to run sequentially, not in parallel with others (used by custom xdist scheduler)

