# See https://pre-commit.com/ for usage and config
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: check-file-length
        name: Check .py files are ≤ 300 lines
        stages: [pre-commit]
        language: system
        entry: python hooks/check_file_length.py
        types: [python]

      - id: autoflake
        name: autoflake
        stages: [pre-commit]
        language: system
        entry: poetry run autoflake --remove-all-unused-imports --in-place --recursive --exclude=apiconfig
        types: [python]

      - id: isort
        name: isort
        stages: [pre-commit]
        language: system
        entry: poetry run isort --profile black --skip-glob="**/apiconfig/*"
        types: [python]

      - id: black
        name: black
        stages: [pre-commit]
        language: system
        entry: poetry run black . --extend-exclude="apiconfig/"
        types: [python]

      - id: flake8
        name: flake8
        stages: [pre-commit]
        language: system
        entry: poetry run flake8
        types: [python]
        exclude: setup.py

      - id: mypy
        name: mypy
        stages: [pre-commit]
        language: system
        entry: poetry run mypy .
        types: [python]
        require_serial: true
        pass_filenames: false

      - id: pytest
        name: pytest (changed files)
        stages: [pre-commit]
        language: system
        entry: python -c "import sys; from subprocess import run; files = ' '.join(sys.argv[1:]); run(f'poetry run pytest {files} -v --no-header --durations=3', shell=True)" --
        types: [python]
        files: ^(crudclient/|tests/unit/).*\.py$
        pass_filenames: true
        verbose: true

      - id: pytest-cov
        name: pytest with coverage
        stages: [pre-push]
        language: system
        entry: poetry run pytest tests/unit/ --cov --cov-report=term-missing --cov-branch --no-header --durations=5
        types: [python]
        pass_filenames: false
        verbose: true
